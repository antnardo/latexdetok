[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "latexdetok"
dynamic = ["version"]
description = "A tolerant LaTeX tokeniser: a .tex file read into a tree of groups, commands and text, which rewrites itself identically and never refuses valid LaTeX."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "antnardo", email = "88662367+antnardo@users.noreply.github.com" }]
keywords = ["latex", "tex", "parser", "tokenizer", "linter", "diagnostics", "syntax-tree"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]
dependencies = []

# The core stays on the standard library; the language server needs a protocol
# implementation, and whoever does not want a server does not carry it.
[project.optional-dependencies]
lsp = ["pygls>=2.0"]

[project.urls]
Homepage = "https://github.com/antnardo/latexdetok"
Documentation = "https://github.com/antnardo/latexdetok/blob/main/docs/API.md"
Repository = "https://github.com/antnardo/latexdetok"
Issues = "https://github.com/antnardo/latexdetok/issues"
Changelog = "https://github.com/antnardo/latexdetok/blob/main/CHANGELOG.md"

[project.scripts]
latexdetok = "latexdetok.__main__:main"
latexdetok-lsp = "latexdetok.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pygls>=2.0",
]
# The mypyc build, apart: it must run under the interpreter it builds for.
compile = [
    "mypy>=1.11",
    "setuptools>=68",
]

# The version lives in the module: one source, which the publication workflow
# compares with the tag.
[tool.hatch.version]
path = "src/latexdetok/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/latexdetok"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/scripts",
    "/editors",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PTH", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode look-alikes: the prose uses typographic dashes

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["latexdetok"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.13"
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true
ignore_missing_imports = true
